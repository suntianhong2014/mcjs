<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sth工具箱</title>
<style>
body{margin:0;padding:26px 18px 50px;background:#fdfdfd;color:#232323;
 font:15px/1.75 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.wrap{max-width:660px;margin:0 auto}
h1{font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:.3px}
.meta{font-size:12.5px;color:#8a8a8a;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
td{padding:11px 4px;border-bottom:1px solid #ececec;vertical-align:middle}
.nm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;color:#141414}
.ds{display:block;color:#8a8a8a;font-size:12px;margin-top:2px;font-family:system-ui,sans-serif}
.sz{color:#a0a0a0;font-size:12px;white-space:nowrap;text-align:right;padding-right:12px}
a{color:#1a5fd0;text-decoration:underline;white-space:nowrap;font-size:13.5px}
a:active{color:#0b3d8f}
.foot{margin-top:22px;font-size:12px;color:#9a9a9a;line-height:1.9}
.foot b{color:#666;font-weight:600}
#gate{max-width:300px;margin:14vh auto 0}
#gate h2{font-size:16px;font-weight:700;margin:0 0 4px}
#gate p{font-size:12.5px;color:#8a8a8a;margin:0 0 14px}
#pw{width:100%;padding:10px 12px;border:1px solid #d8d8d8;border-radius:6px;
 font-size:14px;font-family:inherit;outline:none;background:#fff}
#pw:focus{border-color:#7a7a7a}
#go{margin-top:10px;padding:9px 20px;border:1px solid #333;border-radius:6px;
 background:#333;color:#fff;font-size:13.5px;font-family:inherit;cursor:pointer}
#go:active{background:#111}
#err{margin-top:10px;font-size:12.5px;color:#c04040;min-height:18px}
#wmk{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9;pointer-events:none;
 background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMDAnIGhlaWdodD0nMjAwJz48ZyB0cmFuc2Zvcm09J3JvdGF0ZSgtMjggMTUwIDEwMCknPjx0ZXh0IHg9JzE1MCcgeT0nMTA1JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYnIGZvbnQtc2l6ZT0nMTcnIGZvbnQtd2VpZ2h0PSdib2xkJyBmaWxsPScjMTAxMDEwJyBmaWxsLW9wYWNpdHk9JzAuMTYnPnN0aCDliLbkvZwgwrcg5Lil56aB55uX55So5oqE6KKtPC90ZXh0PjwvZz48L3N2Zz4=");background-repeat:repeat;background-size:300px 200px}
</style>
</head><body>
<div id="wmk" aria-hidden="true"></div>

<div id="gate">
  <h2>sth工具箱</h2>
  <p>需要密码才能进</p>
  <input id="pw" type="password" placeholder="输入密码" autocomplete="off">
  <button id="go">进入</button>
  <div id="err"></div>
</div>

<div class="wrap" id="main" style="display:none">
  <h1>sth工具箱</h1>
  <div class="meta" id="meta">正在读取文件列表…</div>
  <table id="tb"></table>
  <div class="foot">
    手机下载完在<b>文件管理 → 下载</b>里找。<br>
    微信或 QQ 里点不动，右上角「···」→ 在浏览器打开。<br>
    部分杀软会误报，自己判断。
  </div>
</div>

<script>
var FALLBACK = [
  { name:"进程剑", file:"jinchengjian.exe", disp:"进程剑.exe", desc:"进程相关" },
  { name:"efch剑", file:"efch.exe",         disp:"efch剑.exe", desc:"efch 系列" },
  { name:"tool2",  file:"tool2.exe",        disp:"tool2.exe",  desc:"工具箱第二版" },
  { name:"tool",   file:"tool.exe",         disp:"tool.exe",   desc:"工具箱主程序" },
  { name:"ck",     file:"ck.exe",           disp:"ck.exe",     desc:"" }
];

var PASS_HASH = 0;
(function(){
  var s = "STh140728", h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  PASS_HASH = h;
})();
function hash(str){
  var h = 5381;
  for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h;
}
function fmtSize(n){
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function baseName(f){ return String(f).replace(/\.[^.]+$/, ""); }

function render(items){
  var tb = document.getElementById("tb");
  tb.innerHTML = "";
  if (!items.length){
    tb.innerHTML = '<tr><td colspan="3" style="color:#999;padding:24px 4px">files/ 里还没有东西</td></tr>';
    document.getElementById("meta").textContent = "暂无文件";
    return;
  }
  document.getElementById("meta").textContent = items.length + " 个文件 · 点右边下载";
  items.forEach(function(f){
    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td><span class="nm">' + esc(f.name) + '</span>' +
        (f.desc ? '<span class="ds">' + esc(f.desc) + '</span>' : '') + '</td>' +
      '<td class="sz">读取中…</td>' +
      '<td style="text-align:right"><a href="files/' + encodeURIComponent(f.file) +
        '" download="' + esc(f.disp) + '">下载</a></td>';
    tb.appendChild(tr);
    var cell = tr.querySelector(".sz");
    (function(c, file){
      var can = false;
      try { can = (typeof fetch === "function"); } catch(e){}
      if (!can) { c.textContent = "—"; return; }
      try {
        fetch("files/" + encodeURIComponent(file), {method: "HEAD"}).then(function(r){
          if (!r.ok) throw 0;
          var n = parseInt(r.headers.get("content-length") || "0", 10);
          c.textContent = n > 0 ? fmtSize(n) : "—";
        }).catch(function(){ c.textContent = "—"; });
      } catch(e) { c.textContent = "—"; }
    })(cell, f.file);
  });
}

function fromListText(txt){
  var out = [];
  txt.split(/\r?\n/).forEach(function(line){
    line = line.trim();
    if (!line || line.charAt(0) === "#") return;
    var parts = line.split("|");
    var file = parts[0].trim();
    if (!file) return;
    var name = (parts[1] || "").trim();
    var desc = (parts[2] || "").trim();
    out.push({
      name: name || baseName(file) + (/\.exe$/i.test(file) ? ".exe" : ""),
      file: file,
      disp: name ? name + (/\.exe$/i.test(file) ? ".exe" : "") : file,
      desc: desc
    });
  });
  return out;
}

function fromDirHtml(txt){
  var doc = new DOMParser().parseFromString(txt, "text/html");
  var out = [];
  [].forEach.call(doc.querySelectorAll("a"), function(a){
    var href = a.getAttribute("href") || "";
    if (!href || href.charAt(0) === "?" || href.charAt(0) === "/" || href.indexOf("../") === 0) return;
    if (href.charAt(href.length - 1) === "/") return;
    var file = decodeURIComponent(href.replace(/^\.\//, ""));
    if (!/\.(exe|zip|rar|7z|apk|docx?|txt|pdf)$/i.test(file)) return;
    out.push({
      name: file,
      file: file,
      disp: file,
      desc: ""
    });
  });
  return out;
}

function load(){
  var done = false;
  function finish(items, note){
    if (done) return;
    done = true;
    render(items);
    if (note) document.getElementById("meta").textContent = note;
  }
  setTimeout(function(){ finish(FALLBACK, "用内置列表（没读到文件清单）"); }, 4000);

  var hasFetch = false;
  try { hasFetch = (typeof fetch === "function"); } catch(e){}
  if (!hasFetch) { finish(FALLBACK, "浏览器较老，用内置列表"); return; }

  function tryList(){
    try {
      fetch("files/list.txt", {cache: "no-store"}).then(function(r){
        if (!r.ok) throw 0;
        return r.text();
      }).then(function(txt){
        var items = fromListText(txt);
        if (!items.length) throw 0;
        finish(items);
      }).catch(function(){ finish(FALLBACK, "用内置列表（list.txt 没读到）"); });
    } catch(e){ finish(FALLBACK); }
  }

  try {
    fetch("files/", {method: "GET"}).then(function(r){
      if (!r.ok) throw 0;
      return r.text();
    }).then(function(txt){
      var items;
      try { items = fromDirHtml(txt); } catch(e){ items = []; }
      if (!items.length) throw 0;
      finish(items);
    }).catch(function(){ tryList(); });
  } catch(e){ tryList(); }
}

function open_(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("main").style.display = "block";
  try { sessionStorage.setItem("sth_box_ok", "1"); } catch(e){}
  load();
}

(function(){
  try { if (sessionStorage.getItem("sth_box_ok") === "1") { open_(); return; } } catch(e){}
  var pw = document.getElementById("pw"), err = document.getElementById("err");
  function tryOpen(){
    if (hash(pw.value) === PASS_HASH) { err.textContent = ""; open_(); }
    else { err.textContent = "密码不对"; pw.value = ""; pw.focus(); }
  }
  document.getElementById("go").addEventListener("click", tryOpen);
  pw.addEventListener("keydown", function(e){ if (e.key === "Enter") tryOpen(); });
})();
</script>
</body></html>
