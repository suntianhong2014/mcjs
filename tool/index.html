<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sth网盘</title>
<style>
body{margin:0;padding:24px 18px 50px;background:#fdfdfd;color:#232323;
 font:15px/1.75 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:.3px}
.meta{font-size:12.5px;color:#8a8a8a;margin-bottom:14px}
.crumb{font-size:13px;color:#666;margin-bottom:12px;word-break:break-all}
.crumb a{color:#1a5fd0;text-decoration:none;cursor:pointer}
.crumb span{color:#aaa;margin:0 5px}
table{width:100%;border-collapse:collapse}
td{padding:10px 4px;border-bottom:1px solid #efefef;vertical-align:middle}
.nm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;color:#141414;word-break:break-all}
.ds{display:block;color:#8a8a8a;font-size:12px;margin-top:2px;font-family:system-ui,sans-serif}
.sz{color:#a0a0a0;font-size:12px;white-space:nowrap;text-align:right;padding-right:10px}
td.act{text-align:right;white-space:nowrap}
a{color:#1a5fd0;text-decoration:underline;white-space:nowrap;font-size:13.5px}
a:active{color:#0b3d8f}
.dir{cursor:pointer}
.dir:hover .nm{color:#0b3d8f}
.dir .nm::before{content:"▸ ";color:#9bb8e0}
.dir.active-row{background:#f7faff}
.empty{color:#9a9a9a;font-size:13px;padding:30px 4px;text-align:center}
.foot{margin-top:22px;font-size:12px;color:#9a9a9a;line-height:1.9}
.foot b{color:#666;font-weight:600}
#gate{max-width:300px;margin:14vh auto 0}
#gate h2{font-size:16px;font-weight:700;margin:0 0 4px}
#gate p{font-size:12.5px;color:#8a8a8a;margin:0 0 14px}
#pw{width:100%;padding:10px 12px;border:1px solid #d8d8d8;border-radius:6px;
 font-size:14px;font-family:inherit;outline:none;background:#fff}
#pw:focus{border-color:#7a7a7a}
#go{margin-top:10px;padding:9px 20px;border:1px solid #333;border-radius:6px;
 background:#333;color:#fff;font-size:13.5px;font-family:inherit;cursor:pointer}
#go:active{background:#111}
#err{margin-top:10px;font-size:12.5px;color:#c04040;min-height:18px}
#wmk{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9;pointer-events:none;
 background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMDAnIGhlaWdodD0nMjAwJz48ZyB0cmFuc2Zvcm09J3JvdGF0ZSgtMjggMTUwIDEwMCknPjx0ZXh0IHg9JzE1MCcgeT0nMTA1JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYnIGZvbnQtc2l6ZT0nMTcnIGZvbnQtd2VpZ2h0PSdib2xkJyBmaWxsPScjMTAxMDEwJyBmaWxsLW9wYWNpdHk9JzAuMTYnPnN0aCDliLbkvZwgwrcg5Lil56aB55uX55So5oqE6KKtPC90ZXh0PjwvZz48L3N2Zz4=");background-repeat:repeat;background-size:300px 200px}
</style>
</head><body>
<div id="wmk" aria-hidden="true"></div>

<div id="gate">
  <h2>sth网盘</h2>
  <p>需要密码才能进</p>
  <input id="pw" type="password" placeholder="输入密码" autocomplete="off">
  <button id="go">进入</button>
  <div id="err"></div>
</div>

<div class="wrap" id="main" style="display:none">
  <h1>sth网盘</h1>
  <div class="meta" id="meta">正在读取…</div>
  <div class="crumb" id="crumb"></div>
  <table id="tb"></table>
  <div class="foot">
    手机下载完在<b>文件管理 → 下载</b>里找。<br>
    微信或 QQ 里点不动，右上角「···」→ 在浏览器打开。<br>
    部分杀软会误报，自己判断。
  </div>
</div>

<script>
var FALLBACK = [
  "工具/jinchengjian.exe|进程剑|进程相关",
  "工具/efch.exe|efch剑|efch 系列",
  "工具/tool2.exe|tool2|工具箱第二版",
  "工具/tool.exe|tool|工具箱主程序",
  "工具/ck.exe|ck|"
];

var PASS_HASH = 0;
(function(){
  var s = "STh140728", h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  PASS_HASH = h;
})();
function hash(str){
  var h = 5381;
  for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function fmtSize(n){
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}

var TREE = {};      // { folder: { files:[], dirs:[] } }
var PATH = [];      // 当前路径

function parseLines(lines){
  var out = [];
  lines.forEach(function(line){
    line = String(line).trim();
    if (!line || line.charAt(0) === "#") return;
    var p = line.split("|");
    var path = (p[0] || "").trim().replace(/^\/+/, "");
    if (!path) return;
    out.push({
      path: path,
      name: (p[1] || "").trim(),
      desc: (p[2] || "").trim()
    });
  });
  return out;
}

function buildTree(items){
  var root = { dirs: {}, files: [] };
  items.forEach(function(it){
    var parts = it.path.split("/");
    var file = parts.pop();
    var node = root;
    parts.forEach(function(d){
      if (!node.dirs[d]) node.dirs[d] = { dirs: {}, files: [] };
      node = node.dirs[d];
    });
    node.files.push({
      file: file,
      path: it.path,
      name: it.name || file,
      disp: it.name ? it.name + (/\.exe$/i.test(file) ? ".exe" : "") : file,
      desc: it.desc
    });
  });
  return root;
}

function atPath(p){
  var node = TREE;
  for (var i = 0; i < p.length; i++){
    if (!node.dirs[p[i]]) return null;
    node = node.dirs[p[i]];
  }
  return node;
}

function render(){
  var node = atPath(PATH);
  var tb = document.getElementById("tb");
  var crumb = document.getElementById("crumb");
  tb.innerHTML = "";

  var c = '<a data-p="-1">全部</a>';
  PATH.forEach(function(d, i){
    c += '<span>/</span><a data-p="' + i + '">' + esc(d) + '</a>';
  });
  crumb.innerHTML = c;
  [].forEach.call(crumb.querySelectorAll("a"), function(a){
    a.onclick = function(){
      var v = parseInt(a.getAttribute("data-p"), 10);
      PATH = v < 0 ? [] : PATH.slice(0, v + 1);
      render();
    };
  });

  if (!node){
    tb.innerHTML = '<tr><td class="empty">这个文件夹不见了</td></tr>';
    return;
  }

  var dirNames = Object.keys(node.dirs).sort();
  var files = node.files.slice().sort(function(a, b){
    return a.name.localeCompare(b.name, "zh");
  });

  document.getElementById("meta").textContent =
    dirNames.length + " 个文件夹 · " + files.length + " 个文件";

  if (!dirNames.length && !files.length){
    tb.innerHTML = '<tr><td class="empty">这个文件夹是空的</td></tr>';
    return;
  }

  dirNames.forEach(function(d){
    var tr = document.createElement("tr");
    tr.className = "dir";
    tr.innerHTML =
      '<td><span class="nm">' + esc(d) + '/</span>' +
        '<span class="ds">文件夹</span></td>' +
      '<td class="sz">—</td>' +
      '<td class="act"><a>打开</a></td>';
    tr.onclick = function(){ PATH = PATH.concat([d]); render(); };
    tb.appendChild(tr);
  });

  files.forEach(function(f){
    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td><span class="nm">' + esc(f.name) + '</span>' +
        (f.desc ? '<span class="ds">' + esc(f.desc) + '</span>' : '') + '</td>' +
      '<td class="sz">读取中…</td>' +
      '<td class="act"><a href="' + esc(f.path) + '" download="' + esc(f.disp) + '">下载</a></td>';
    tb.appendChild(tr);
    var cell = tr.querySelector(".sz");
    (function(c, path){
      var can = false;
      try { can = (typeof fetch === "function"); } catch(e){}
      if (!can) { c.textContent = "—"; return; }
      try {
        fetch(encodeURI(path), {method: "HEAD"}).then(function(r){
          if (!r.ok) throw 0;
          var n = parseInt(r.headers.get("content-length") || "0", 10);
          c.textContent = n > 0 ? fmtSize(n) : "—";
        }).catch(function(){ c.textContent = "—"; });
      } catch(e) { c.textContent = "—"; }
    })(cell, f.path);
  });
}

function load(){
  var done = false;
  function finish(lines, note){
    if (done) return;
    done = true;
    TREE = buildTree(parseLines(lines));
    PATH = [];
    render();
    if (note) document.getElementById("meta").textContent = note;
  }
  setTimeout(function(){ finish(FALLBACK, "用内置列表（没读到文件清单）"); }, 4000);

  var hasFetch = false;
  try { hasFetch = (typeof fetch === "function"); } catch(e){}
  if (!hasFetch) { finish(FALLBACK, "浏览器较老，用内置列表"); return; }

  try {
    fetch("list.txt", {cache: "no-store"}).then(function(r){
      if (!r.ok) throw 0;
      return r.text();
    }).then(function(txt){
      var lines = txt.split(/\r?\n/);
      if (!parseLines(lines).length) throw 0;
      finish(lines);
    }).catch(function(){ finish(FALLBACK, "用内置列表（list.txt 没读到）"); });
  } catch(e){ finish(FALLBACK); }
}

function open_(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("main").style.display = "block";
  try { sessionStorage.setItem("sth_box_ok", "1"); } catch(e){}
  load();
}

(function(){
  try { if (sessionStorage.getItem("sth_box_ok") === "1") { open_(); return; } } catch(e){}
  var pw = document.getElementById("pw"), err = document.getElementById("err");
  function tryOpen(){
    if (hash(pw.value) === PASS_HASH) { err.textContent = ""; open_(); }
    else { err.textContent = "密码不对"; pw.value = ""; pw.focus(); }
  }
  document.getElementById("go").addEventListener("click", tryOpen);
  pw.addEventListener("keydown", function(e){ if (e.key === "Enter") tryOpen(); });
})();
</script>
</body></html>
