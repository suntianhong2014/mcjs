<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的文档</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;padding:22px 16px 40px;color:#1f2937;
  background:#f4f7fb;
  background-image:
    radial-gradient(circle at 12% 6%,rgba(94,234,212,.22),transparent 44%),
    radial-gradient(circle at 88% 94%,rgba(96,165,250,.20),transparent 46%),
    linear-gradient(160deg,#f7fbff,#eef4ff 55%,#f4fffb);
  background-attachment:fixed;
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:23px;font-weight:800;letter-spacing:.5px;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#64748b;font-size:13.5px;margin-bottom:22px;line-height:1.7}
.tip{
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);
  border-radius:14px;padding:12px 14px;font-size:12.5px;color:#475569;
  line-height:1.8;margin-bottom:20px;
  box-shadow:0 4px 16px rgba(31,41,55,.06)
}
.tip b{color:#0f766e}
.card{
  background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);
  border-radius:16px;padding:15px 16px;margin-bottom:12px;
  box-shadow:0 6px 22px rgba(31,41,55,.07);
}
.row{display:flex;align-items:center;gap:12px}
.ico{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;position:relative;
  background:linear-gradient(135deg,#5EEAD4,#38bdf8);
}
.ico::after{
  content:"";position:absolute;left:12px;top:11px;width:18px;height:20px;
  border:2px solid rgba(255,255,255,.95);border-radius:3px;
  background:rgba(255,255,255,.28)
}
.ico::before{
  content:"";position:absolute;left:18px;top:18px;width:12px;height:2px;
  background:rgba(255,255,255,.95);box-shadow:0 5px 0 rgba(255,255,255,.95);z-index:2
}
.name{font-size:15.5px;font-weight:700;color:#111827;word-break:break-all}
.desc{font-size:12.5px;color:#64748b;margin-top:3px}
.meta{font-size:11.5px;color:#94a3b8;margin-top:5px}
.btns{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
a.btn{
  flex:1 1 120px;display:block;text-align:center;text-decoration:none;
  padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700;
  background:linear-gradient(135deg,#0ea5a4,#0891b2);color:#fff;
  box-shadow:0 4px 14px rgba(8,145,178,.28);transition:transform .12s
}
a.btn:active{transform:scale(.97)}
a.btn.ghost{
  background:rgba(255,255,255,.9);color:#0f766e;border:1px solid #cbd5e1;
  box-shadow:0 2px 8px rgba(31,41,55,.06)
}
.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:26px;line-height:1.9}
@media (max-width:400px){h1{font-size:20px}.name{font-size:14.5px}}
</style>
</head><body>
<div class="wrap">

  <h1>我的文档</h1>
  <div class="sub">点下面的按钮就能下载<br>下载完在手机的「文件管理 → 下载」里找</div>

  <div class="tip">
    <b>手机点不动怎么办：</b><br>
    微信或 QQ 里打开，有时候不让下载 ✗<br>
    点右上角的「···」，选「在浏览器打开」，再点下载就行 ✓<br>
    Word 文档用 WPS 或手机自带文档查看器都能打开 ✓
  </div>

  <div id="list"></div>

  <div class="foot">
    suntianhong 的文档页<br>
    有新文档会加在这里
  </div>
</div>

<script>
var FILES = [
  { name:"等一等，说慢点（作文）", file:"files/作文-等一等说慢点.docx",
    desc:"语文大赛作文 · Word 版，格式已排好", tag:"DOCX" },
  { name:"等一等，说慢点（纯文本）", file:"files/作文-等一等说慢点.txt",
    desc:"同一个作文，纯文本，方便复制到别处", tag:"TXT" },
  { name:"作文说明", file:"files/说明.md",
    desc:"立意、结构、像人不像AI的地方、交前要改什么", tag:"MD" }
];

var box = document.getElementById("list");
FILES.forEach(function(f){
  var d = document.createElement("div");
  d.className = "card";
  d.innerHTML =
    '<div class="row"><div class="ico"></div><div>' +
      '<div class="name">' + f.name + '</div>' +
      '<div class="desc">' + f.desc + '</div>' +
      '<div class="meta">' + f.tag + '</div>' +
    '</div></div>' +
    '<div class="btns">' +
      '<a class="btn" href="' + f.file + '" download>下载</a>' +
      '<a class="btn ghost" href="' + f.file + '" target="_blank">直接看</a>' +
    '</div>';
  box.appendChild(d);
});
</script>
</body></html>
