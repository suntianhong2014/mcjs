#creeperBox{
  position:fixed;right:12px;top:12px;z-index:100002;width:88px;
  padding:7px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:rgba(20,20,26,.12);border:2px solid rgba(0,0,0,.2);border-radius:8px;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:transform .08s,background .15s;
}
#creeperBox:hover{background:rgba(20,20,26,.22)}
#creeperBox:active{transform:scale(.9)}
#creeperBox.dead{opacity:.4;pointer-events:none;cursor:default}
.creeper{width:56px;height:56px;display:block;image-rendering:pixelated}
.hearts{display:grid;grid-template-columns:repeat(5,1fr);width:100%;justify-items:center}
.heart{
  width:16px;height:16px;display:block;position:relative;
  background-image:var(--heart-empty);background-size:100% 100%;
  background-repeat:no-repeat;image-rendering:pixelated;
}
.heart::after{
  content:"";position:absolute;left:0;top:0;right:0;bottom:0;
  background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;
  background-image:none;
}
.heart.full::after{background-image:var(--heart-full)}
.heart.half::after{background-image:var(--heart-half)}
@keyframes creeperShake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-4px,1px) rotate(-3deg)}
  40%{transform:translate(4px,-1px) rotate(3deg)}
  65%{transform:translate(-3px,1px) rotate(-2deg)}
  85%{transform:translate(2px,0) rotate(1deg)}
}
@keyframes creeperHurtFlash{
  0%{filter:none}
  5%{filter:brightness(.98) contrast(1.35) sepia(1) saturate(30) hue-rotate(-34deg)}
  25%{filter:brightness(.98) contrast(1.3) sepia(1) saturate(26) hue-rotate(-32deg)}
  60%{filter:contrast(1.15) sepia(.5) saturate(8) hue-rotate(-20deg)}
  100%{filter:none}
}
#creeperBox.hit .creeper{animation:creeperHurtFlash .45s ease-out}
#creeperBox.hit{animation:creeperShake .2s}
@keyframes ringRed{
  0%{box-shadow:0 0 0 0 rgba(255,40,40,0),0 0 0 rgba(255,0,0,0)}
  12%{box-shadow:0 0 0 3px rgba(255,45,45,.9),0 0 22px rgba(255,0,0,.75)}
  100%{box-shadow:0 0 0 0 rgba(255,40,40,0),0 0 0 rgba(255,0,0,0)}
}
#creeperBox.hit{animation:creeperShake .2s,ringRed .45s ease-out}
@keyframes creeperDieFade{
  0%{filter:brightness(1) contrast(1.4) sepia(1) saturate(30) hue-rotate(-34deg);transform:scale(1)}
  20%{filter:brightness(1.05) contrast(1.45) sepia(1) saturate(34) hue-rotate(-36deg);transform:scale(1.16)}
  100%{filter:brightness(.75) saturate(.1);transform:scale(.88)}
}
#creeperBox.dead .creeper{animation:creeperDieFade 1.2s forwards}

@keyframes tapPop{
  0%{transform:scale(1.7);opacity:0}
  22%{transform:scale(1);opacity:1}
  70%{transform:scale(1);opacity:1}
  100%{transform:scale(.65);opacity:0}
}
.tapcross.aligned{animation:tapFadeOut .34s linear forwards}
@keyframes tapFadeOut{0%{opacity:.95}100%{opacity:0}}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh; color: #2b2b2b;

h1 {

.sub { text-align: center; color: #5c5240; font-size: 14px; margin-bottom: 26px; }

<script>
(function(){
  var LINK = "https://sth.zh.kg/sth.html";
  var TOTAL = 10, hp = TOTAL * 2, dead = false;
  var box = document.getElementById("creeperBox");
  var wrap = document.getElementById("creeperHearts");
  var dsc = document.getElementById("deathScreen");
  if (!box || !wrap) return;
  var hearts = [];
  for (var i = 0; i < TOTAL; i++) {
    var s = document.createElement("span");
    s.className = "heart full";
    wrap.appendChild(s);
    hearts.push(s);
  }
  function draw(){
    for (var i = 0; i < TOTAL; i++) {
      var v = hp - i * 2;
      hearts[i].className = "heart " + (v >= 2 ? "full" : (v === 1 ? "half" : "empty"));
    }
  }
  var SND = {};
  function initSnd(){
    ["snd1","snd2","snd3","sndFizz","sndBoom"].forEach(function(id){
      var a = document.getElementById(id);
      if (!a) return;
      SND[id] = a;
      try { a.load(); } catch(e){}
    });
  }
  function synth(strong){
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      if (!window.__ac) window.__ac = new C();
      var ac = window.__ac;
      if (ac.state === "suspended") ac.resume();
      var t = ac.currentTime;
      var o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(strong ? 260 : 340, t);
      o.frequency.exponentialRampToValueAtTime(strong ? 70 : 150, t + (strong ? 0.7 : 0.13));
      f.type = "lowpass"; f.frequency.value = strong ? 700 : 950;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(strong ? 0.24 : 0.30, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (strong ? 1.0 : 0.26));
      o.connect(f); f.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + (strong ? 1.05 : 0.28));
    } catch(e){}
  }
  function play(id, strong){
    var a = SND[id];
    if (!a) { synth(strong); return; }
    try {
      try { a.pause(); } catch(e){}
      if (a.readyState > 0) { try { a.currentTime = 0; } catch(e){} }
      var p = a.play();
      if (p && p.then) {
        p.then(function(){}).catch(function(){ synth(strong); });
      }
    } catch(e) { synth(strong); }
  }
  function hurtSound(){
    play("snd" + (1 + Math.floor(Math.random() * 3)), false);
  }
  function jump(){
    try { location.href = LINK; } catch(e){}
    setTimeout(function(){ try { location.assign(LINK); } catch(e){} }, 250);
    setTimeout(function(){ try { window.open(LINK, "_self"); } catch(e){} }, 550);
  }
  function die(){
    dead = true;
    draw();
    box.className = "dead";
    play("sndFizz", false);
    setTimeout(function(){ play("sndBoom", true); }, 1300);
    setTimeout(function(){ if (dsc) dsc.className = "on"; }, 1450);
    box.classList.add("dead");
  }
  function hit(){
    if (dead) return;
    hp -= 1; if (hp < 0) hp = 0;
    draw();
    hurtSound();
    box.classList.remove("hit"); void box.offsetWidth; box.classList.add("hit");
    if (hp <= 0) setTimeout(die, 260);
  }
  initSnd();
  window.addEventListener("load", initSnd);
  var unlocked = false;
  function unlock(){
    if (unlocked) return;
    unlocked = true;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (C) { if (!window.__ac) window.__ac = new C(); if (window.__ac.state === "suspended") window.__ac.resume(); }
    } catch(e){}
    ["snd1","snd2","snd3","sndFizz","sndBoom"].forEach(function(id){
      var a = SND[id]; if (!a) return;
      try {
        a.muted = true;
        var p = a.play();
        if (p && p.then) {
          p.then(function(){ try{ a.pause(); a.currentTime = 0; }catch(e){} a.muted = false; })
           .catch(function(){ try{ a.pause(); }catch(e){} a.muted = false; });
        } else {
          try{ a.pause(); a.currentTime = 0; }catch(e){}
          a.muted = false;
        }
      } catch(e){ try{ a.muted = false; }catch(e2){} }
    });
  }
  ["pointerdown","touchstart","mousedown","click"].forEach(function(ev){
    document.addEventListener(ev, unlock, { once: true, passive: true });
  });
  (function(){
    var a = document.getElementById("sndClick");
    if (!a) return;
    function play(){
      try {
        a.volume = 0.45;
        if (a.readyState > 0) { try { a.currentTime = 0; } catch(e){} }
        var p = a.play();
        if (p && p.catch) p.catch(function(){});
      } catch(e){}
    }
    document.addEventListener("click", play, true);
    document.addEventListener("touchstart", function once(){
      try {
        a.muted = true;
        var p = a.play();
        if (p && p.then) p.then(function(){ a.pause(); a.currentTime = 0; a.muted = false; })
                          .catch(function(){ a.muted = false; });
        else { a.pause(); a.muted = false; }
      } catch(e){ try{ a.muted = false; }catch(e2){} }
      document.removeEventListener("touchstart", once, true);
    }, true);
  })();
  (function(){
    var hasMouse = false;
    try {
      hasMouse = window.matchMedia && window.matchMedia("(hover:hover) and (pointer:fine)").matches;
    } catch(e){}
    function burst(x, y){
      try {
        var d = document.createElement("div");
        d.className = "tapcross" + (hasMouse ? " aligned" : "");
        d.style.left = x + "px";
        d.style.top  = y + "px";
        document.body.appendChild(d);
        setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, hasMouse ? 360 : 450);
      } catch(e){}
    }
    if (window.PointerEvent) {
      document.addEventListener("pointerdown", function(e){ burst(e.clientX, e.clientY); }, true);
    } else {
      document.addEventListener("mousedown", function(e){ burst(e.clientX, e.clientY); }, true);
      document.addEventListener("touchstart", function(e){
        var t = e.touches && e.touches[0];
        if (t) burst(t.clientX, t.clientY);
      }, true);
    }
  })();
  box.addEventListener("click", hit);
  draw();
})();
</script>
